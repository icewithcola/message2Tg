name: Build & Release APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execution permissions for Gradle
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          export KEYSTORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}";
          export ALIAS_NAME="${{ secrets.KEY_ALIAS }}";
          export ALIAS_PASS="${{ secrets.KEY_PASSWORD }}";
          ./gradlew :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.event.head_commit.message, '[Release]')

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v3
        with:
          name: release-apk
          path: app/build/outputs/apk/release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: "New APK release"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
